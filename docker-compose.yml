services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: quizforge-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=/app/data/quizforge.db
      - JWT_SECRET=${JWT_SECRET:-quizforge-production-super-secret-jwt-key-min-32-chars}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - quizforge-data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - quizforge-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: quizforge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quizforge-network

volumes:
  quizforge-data:
    driver: local

networks:
  quizforge-network:
    driver: bridge
