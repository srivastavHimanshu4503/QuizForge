name: QuizForge Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Typecheck, Vitest Suite & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @quiz-forge/shared build

      - name: Monorepo Strict Typecheck
        run: pnpm typecheck

      - name: Run Database Migrations
        run: pnpm db:migrate

      - name: Automated Vitest Test Suite (25 Suites, 222+ Tests)
        run: pnpm test

      - name: Frontend Code-Split Production Build
        run: pnpm --filter @quiz-forge/frontend build

  docker-smoke-test:
    name: Docker Containerization Smoke Test
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: quizforge-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          tags: quizforge-frontend:ci
