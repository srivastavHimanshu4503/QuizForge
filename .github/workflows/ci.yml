name: QuizForge CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @quiz-forge/shared build

      - name: Monorepo Typecheck
        run: pnpm typecheck

      - name: Run Database Migrations
        run: pnpm db:migrate

      - name: Automated Test Suite (132 Tests)
        run: pnpm test

      - name: Production Bundle Build
        run: pnpm build
