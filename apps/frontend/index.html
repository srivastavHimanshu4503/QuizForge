<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('color-scheme') || localStorage.getItem('theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = stored === 'light' ? 'light' : 'light dark';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>QuizForge — AI-Powered Assessment & Code Review Platform</title>
  </head>
  <body class="bg-[#F8F9FC] text-[#1E293B] min-h-screen antialiased selection:bg-[#1935CA] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
